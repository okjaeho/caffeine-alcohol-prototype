<!doctype html>
<html lang="ko">
<head>
<title>잔잔</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="잔잔">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: native-style screen stack. One question per screen, slide transitions, sticky bottom CTA.
   Home = gray grouped background, white cards with one big sentence each. Coffee brown / soju green as data colors, blue for actions. */
:root{
  --bg:#FFFFFF; --bg-2:#F2F4F6; --card:#FFFFFF; --ink:#191F28; --ink-2:#4E5968; --ink-3:#8B95A1; --line:#E5E8EB;
  --fill:#F2F4F6; --fill-2:#E3E7EB; --accent:#2F6FEB; --accent-soft:#EAF1FE; --on-accent:#FFFFFF; --toast-link:#8AB6FF;
  --caf:#8A5A3B; --caf-soft:#F4ECE6; --alc:#13A26B; --alc-soft:#E2F5EC;
  --warn:#B06A00; --warn-bar:#F5A623; --warn-soft:#FFF4E0; --danger:#E5384A; --danger-soft:#FDEBED;
  --liq-clear:#CFE8F6; --liq-beer:#F4B63C; --liq-foam:#FFF4D4; --liq-wine:#A3203F; --liq-mak:#E9E1CE; --liq-whisky:#C97C2E; --liq-soda:#DDF1E4; --liq-energy:#EBC94B; --liq-green:#7CCB5A; --liq-cream:#E6D3B3; --liq-cola:#5A3A26;
  --shadow:0 10px 30px rgba(0,20,50,.16);
  --f:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17171C; --bg-2:#101013; --card:#1F1F26; --ink:#ECECEF; --ink-2:#B1B1BA; --ink-3:#80808A; --line:#2B2B33;
  --fill:#26262E; --fill-2:#34343E; --accent:#4C8DF6; --accent-soft:#1B2840; --on-accent:#FFFFFF; --toast-link:#2F6FEB;
  --caf:#D3A07A; --caf-soft:#2B221C; --alc:#3CCB8F; --alc-soft:#14291F;
  --warn:#FFB547; --warn-bar:#F5A623; --warn-soft:#30260F; --danger:#FF5D6C; --danger-soft:#3A1C21;
  --liq-clear:#36566A; --liq-beer:#D99A22; --liq-foam:#EADFC2; --liq-wine:#B8344F; --liq-mak:#8A826E; --liq-whisky:#B06A22; --liq-soda:#2F5747; --liq-energy:#B8962B; --liq-green:#4E9A36; --liq-cream:#9C8763; --liq-cola:#7A5238;
  --shadow:0 10px 30px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17171C; --bg-2:#101013; --card:#1F1F26; --ink:#ECECEF; --ink-2:#B1B1BA; --ink-3:#80808A; --line:#2B2B33;
  --fill:#26262E; --fill-2:#34343E; --accent:#4C8DF6; --accent-soft:#1B2840; --on-accent:#FFFFFF; --toast-link:#2F6FEB;
  --caf:#D3A07A; --caf-soft:#2B221C; --alc:#3CCB8F; --alc-soft:#14291F;
  --warn:#FFB547; --warn-bar:#F5A623; --warn-soft:#30260F; --danger:#FF5D6C; --danger-soft:#3A1C21;
  --liq-clear:#36566A; --liq-beer:#D99A22; --liq-foam:#EADFC2; --liq-wine:#B8344F; --liq-mak:#8A826E; --liq-whisky:#B06A22; --liq-soda:#2F5747; --liq-energy:#B8962B; --liq-green:#4E9A36; --liq-cream:#9C8763; --liq-cola:#7A5238;
  --shadow:0 10px 30px rgba(0,0,0,.55); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%}
body{height:100%;margin:0;overflow:hidden;background:var(--bg-2);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
input{font:inherit;color:inherit;letter-spacing:inherit}
p,h1,h2,h3{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

#root{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:500px){#root{box-shadow:0 0 0 1px var(--line)}}
#stage{position:absolute;inset:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;background:var(--bg);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.screen.tabscr{z-index:1;background:var(--bg-2);padding-bottom:100px}
.screen.flow{z-index:10}
.screen > *{flex-shrink:0}   /* 화면이 길어도 가로 스크롤 줄이 눌려 사라지지 않게 */

/* top bar */
.bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;min-height:56px;margin:0 -10px;background:var(--bg)}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:active{background:var(--fill)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px;color:var(--ink-3)}
.icon-sp{width:44px;flex:none}
.prog{flex:1;height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin:0 12px}
.prog i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.sp{flex:1}
.bar-skip{flex:none;height:44px;padding:0 12px;border-radius:12px;font-size:15px;font-weight:600;color:var(--ink-3)}
.bar-skip:active{background:var(--fill)}

/* type */
.eyebrow{font-size:15px;font-weight:700;color:var(--accent);margin-top:20px}
.eyebrow.caf{color:var(--caf)} .eyebrow.alc{color:var(--alc)}
.eyebrow + .h{margin-top:6px}
.h{font-size:26px;line-height:1.42;font-weight:700;letter-spacing:-.025em;margin-top:20px;text-wrap:balance}
.h .num{font-variant-numeric:tabular-nums;color:var(--accent)}
.h .num.caf{color:var(--caf)} .h .num.alc{color:var(--alc)}
.sub{font-size:16px;line-height:1.6;color:var(--ink-2);margin-top:10px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;margin-block:auto}
.center .h{margin-top:24px}

/* options */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:32px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:16px 20px;border-radius:16px;background:var(--fill);font-size:17px;font-weight:600;transition:background-color .15s,box-shadow .15s,transform .12s}
.opt:active{transform:scale(.985)}
.opt-t{flex:1;min-width:0}
.opt small{display:block;font-size:14px;font-weight:400;color:var(--ink-3);margin-top:2px}
.opt .r{flex:none;font-size:16px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt[aria-pressed="true"] small,.opt[aria-pressed="true"] .r{color:var(--accent)}
.ck{flex:none;width:26px;height:26px;border-radius:50%;background:var(--fill-2);color:var(--fill);display:grid;place-items:center;transition:background-color .15s,color .15s}
.opt[aria-pressed="true"] .ck{background:var(--accent);color:var(--on-accent)}

/* inputs */
.big-in{display:flex;align-items:baseline;gap:8px;margin-top:44px;padding-bottom:10px;border-bottom:2px solid var(--line);transition:border-color .2s;cursor:text}
.big-in:focus-within{border-color:var(--accent)}
.big-in input{flex:0 1 auto;min-width:1.2ch;width:2.4ch;max-width:100%;border:0;background:none;outline:none;padding:0;font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big-in input::placeholder{color:var(--fill-2)}
.big-in span{font-size:24px;font-weight:700;color:var(--ink-2)}
.big-in.sm{margin-top:36px} .big-in.sm input{font-size:32px} .big-in.sm span{font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.err{color:var(--danger);font-size:14px;margin-top:8px}
.field{display:block;margin-top:28px}
.field > span{display:block;font-size:14px;font-weight:600;color:var(--ink-3);margin-bottom:8px}
.text-in{width:100%;height:52px;padding:0 16px;border-radius:14px;border:0;background:var(--fill);font-size:16px;outline:none}
.text-in:focus{box-shadow:inset 0 0 0 2px var(--accent)}

/* cta */
.cta{position:sticky;bottom:0;z-index:2;margin-top:auto;padding:28px 0 16px;background:linear-gradient(to top,var(--bg) 72%,transparent)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:700;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.3;cursor:default;transform:none}
.btn.sec{background:var(--fill);color:var(--ink);margin:0;font-size:17px;letter-spacing:inherit;align-items:center;gap:0}
.btn.warn{background:var(--danger)}
.btn-row{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.txt-btn{display:block;margin:10px auto 0;padding:8px 14px;font-size:15px;font-weight:600;color:var(--ink-3);text-align:center}
.cta-note{text-align:center;font-size:14px;color:var(--ink-3);margin-top:12px}

/* welcome */
.welcome{padding-top:36px}
.hero{display:flex;align-items:flex-end;gap:16px;height:140px}
.hb{position:relative;width:76px;height:124px;border:3px solid var(--ink);border-top:0;border-radius:0 0 22px 22px;overflow:hidden}
.hb.sm{width:54px;height:86px;border-radius:0 0 16px 16px}
.hb::after{content:"";position:absolute;left:0;right:0;top:24%;border-top:2px dashed var(--danger)}
.hl{position:absolute;left:0;right:0;bottom:0}
.hl.caf{background:var(--caf)} .hl.alc{background:var(--alc)}

/* result */
.cups{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-top:28px}
.mini{position:relative;width:30px;height:40px;border:2.5px solid var(--ink-3);border-top:0;border-radius:0 0 9px 9px;overflow:hidden}
.mini i{position:absolute;left:0;right:0;bottom:0}
.mini.caf i{background:var(--caf)} .mini.alc i{background:var(--alc)}
.reason{margin-top:24px;padding:16px 18px;border-radius:16px;background:var(--fill);font-size:15px;line-height:1.55;color:var(--ink-2)}
.why{margin-top:10px}
.why summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:2px;font-size:15px;font-weight:600;color:var(--ink-3);padding:8px 2px}
.why summary::-webkit-details-marker{display:none}
.why summary svg{transition:transform .2s}
.why[open] summary svg{transform:rotate(90deg)}
.factors{list-style:none;margin:2px 0 0;padding:0}
.factors li{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink-2)}
.factors li span:last-child{font-weight:600;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.factors li.total{font-weight:700;color:var(--ink)}
.spinner{width:48px;height:48px;border-radius:50%;border:4px solid var(--fill);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.res-ic{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.res-ic.soft{background:var(--accent-soft);color:var(--accent)}
.res-ic .draw{stroke-dasharray:20}

/* record flow */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:32px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:20px 18px 18px;border-radius:22px;background:var(--fill);min-height:156px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin-bottom:auto}
.tile.caf .tile-ic{background:var(--caf-soft);color:var(--caf)}
.tile.alc .tile-ic{background:var(--alc-soft);color:var(--alc)}
.tile b{font-size:18px;font-weight:700;margin-top:16px}
.tile small{font-size:13.5px;color:var(--ink-3)}
.sec2{font-size:15px;font-weight:700;color:var(--ink-3);margin-top:32px}
.rows{display:flex;flex-direction:column;margin:8px -12px 0}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;border-radius:14px;transition:background-color .12s}
.row:hover,.row:active{background:var(--fill)}
.row-t{flex:1;min-width:0}
.row-t b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-t small{display:block;font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{flex:none;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.row-r.caf{color:var(--caf)} .row-r.alc{color:var(--alc)}
.row-r small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-3)}
.none{padding:20px 12px;color:var(--ink-3);font-size:15px}
.ghost{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;padding:15px;border-radius:16px;font-size:15px;font-weight:600;color:var(--ink-2);background:var(--fill);cursor:pointer;width:100%}
.ghost:active{background:var(--fill-2)}
.search{position:relative;margin-top:24px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;height:50px;padding:0 16px 0 44px;border-radius:14px;border:0;background:var(--fill);font-size:16px;outline:none}
.search input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips.center{justify-content:center;margin-top:28px}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-size:14.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.photo{display:flex;align-items:center;gap:12px;margin-top:20px;padding:10px;border-radius:16px;background:var(--fill)}
.photo img{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none}
.photo p{flex:1;font-size:14px;color:var(--ink-2);line-height:1.45}
.recipe{margin-top:28px;border-radius:20px;background:var(--fill);padding:6px 18px}
.rc{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.rc:first-child{border-top:0}
.rc span:first-child{flex:1}
.rc .n{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.rc .g{width:56px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rc.total{font-weight:700;color:var(--alc)}
.qty{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:56px}
.qbtn{width:56px;height:56px;border-radius:50%;background:var(--fill);font-size:28px;font-weight:500;display:grid;place-items:center;transition:transform .12s,opacity .2s}
.qbtn:active{transform:scale(.92)}
.qbtn:disabled{opacity:.3}
.qval{min-width:110px;text-align:center}
.qval b{display:inline-block;font-size:56px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.qval span{font-size:22px;font-weight:700;color:var(--ink-2);margin-left:4px}
.qsum{text-align:center;margin-top:16px;font-size:16px;color:var(--ink-2);font-weight:600}
.other{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:12px 16px 12px 20px;border-radius:16px;border:1.5px dashed var(--line)}
.other span{flex:1;font-size:15px;font-weight:600;color:var(--ink-2)}
.other input{height:36px;padding:0 10px;border-radius:10px;border:0;background:var(--fill);font-size:15px;font-weight:600}
.vis{margin-top:28px;padding:20px;border-radius:20px;background:var(--fill)}
.vis-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14.5px;color:var(--ink-3)}
.vis-row b{font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.vis-row b.over{color:var(--danger)}
.vis-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.gauge{position:relative;display:block;height:12px;border-radius:6px;background:var(--fill-2);margin-top:12px;overflow:hidden}
.card .gauge{background:var(--fill);margin-top:18px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.gauge i.prev{opacity:.3}
.alist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.al{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:16px;font-size:15px;line-height:1.5;background:var(--warn-soft);color:var(--warn)}
.al.danger{background:var(--danger-soft);color:var(--danger)}
.al svg{flex:none;margin-top:1px}
.tip{margin-top:12px;font-size:15px;color:var(--ink-2);text-align:center}

/* home / tabs */
.home{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.htop{display:flex;justify-content:space-between;align-items:center;min-height:60px;padding-top:4px}
.logo{font-size:23px;font-weight:800;letter-spacing:-.05em}
.hdate{font-size:14px;font-weight:600;color:var(--ink-3)}
.tab-h{font-size:26px;font-weight:800;letter-spacing:-.03em;padding-top:20px;padding-bottom:4px}
.card{display:block;width:100%;background:var(--card);border-radius:24px;padding:22px 22px 20px;text-align:left}
button.card{transition:transform .12s}
button.card:active{transform:scale(.985)}
.c-label{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:var(--ink-2)}
.c-label > svg,.c-label .score{margin-left:auto}
.c-label > svg{color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.c-big{display:block;font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.32;margin-top:8px;font-variant-numeric:tabular-nums}
.c-big.over{color:var(--danger)}
.c-sub{display:block;font-size:15px;color:var(--ink-3);margin-top:2px}
.c-foot{display:flex;justify-content:space-between;margin-top:10px;font-size:13.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.c-extra{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.c-extra b{font-weight:700;font-variant-numeric:tabular-nums}
.prompt{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:24px;padding:18px 18px 18px 20px;text-align:left;transition:transform .12s}
.prompt:active{transform:scale(.985)}
.prompt .pi{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.prompt .pt{flex:1;min-width:0}
.prompt b{display:block;font-size:16px;font-weight:700}
.prompt small{display:block;font-size:14px;color:var(--ink-3)}
.prompt > svg{color:var(--ink-3);flex:none}
.banner{display:flex;gap:10px;align-items:flex-start;padding:16px 18px;border-radius:20px;background:var(--warn-soft);color:var(--warn);font-size:15px;line-height:1.5;font-weight:500}
.banner.danger{background:var(--danger-soft);color:var(--danger)}
.banner svg{flex:none;margin-top:1px}
.banner small{display:block;font-size:13px;opacity:.85;margin-top:2px}
.sec{display:flex;align-items:baseline;gap:8px;font-size:18px;font-weight:700;margin:14px 4px 0;letter-spacing:-.02em}
.sec small{font-size:14px;font-weight:500;color:var(--ink-3)}
.qrow{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.qrow::-webkit-scrollbar{display:none}
.qchip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border-radius:18px;background:var(--card);max-width:200px;text-align:left;transition:transform .12s}

.li.sw{cursor:pointer}
.sw-t{flex:1;min-width:0}
.sw-t small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-3);margin-top:2px;line-height:1.45}
.swi{-webkit-appearance:none;appearance:none;width:46px;height:28px;margin:0;border-radius:14px;background:var(--fill-2);position:relative;flex:none;cursor:pointer;transition:background-color .2s}
.swi::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.swi:checked{background:var(--accent)}
.swi:checked::after{transform:translateX(18px)}
.rrow .rt.nt{width:auto;min-width:84px;white-space:nowrap}
.whyt{margin-top:18px}
.whyt p{font-size:14px;font-weight:600;color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--fill);padding:5px 10px;border-radius:10px}
.card .tags span{background:var(--bg-2)}
.logo i,.dotc{font-style:normal;color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function shrink(a) { const n = 160, k = Math.floor(a.length / n), o = []; for (let i = 0; i < n; i++) { let s = 0; for (let j = 0; j < k; j++) s += a[i * k + j]; o.push(s / k); } const m = Math.hypot(...o) || 1; return o.map(v => Math.round(v / m * 1000) / 1000); }

function guess(preds, col, emb) {

  preds.forEach(pr => {
    const m = VLAB.find(([re]) => re.test(pr.className)); if (!m) return; const w = pr.probability, k = m[1];
    if (k === 'beerglass') { add('beer', w * (C === 'yellow' || C === 'orange' ? 1.2 : 0.8), '맥주잔', {glass:'beer'}); add('mixb', w * 0.6, '맥주잔 · 소맥일 수도', mixOpts('beer', [['soju', SOJU_ML], ['beer', 160]])); }
    if (k === 'beerbottle') add('beer', w, '맥주병', {glass:'bot500'});
    if (k === 'pet') { add('soju', w * (C === 'green' || C2 === 'green' || C === 'clear' ? 1.1 : 0.6), '소주병·페트병', {glass:'bot360'}); add('beer', w * (C === 'yellow' || C === 'brown' ? 0.7 : 0.2), '맥주 페트병', {glass:'bot500'}); }

    if (k === 'winebottle' || k === 'redwine') add('wine', w * 1.2, k === 'redwine' ? '와인잔' : '와인병', {glass:k === 'redwine' ? 'wine' : 'bot750'});
    if (k === 'goblet' && C === 'red') add('wine', w, '와인잔', {glass:'wine'});
    if (k === 'goblet' || k === 'cocktail' || k === 'creamy') (COCK[C] || []).forEach((id, i) => add(id, w * (1 - i * 0.2), `칵테일잔 · ${CNAME[C]} 색`));
    if (k === 'espresso') add('espresso', w, '에스프레소');

      if (cafeIt) add(cafeIt.id, w * 0.7, `${cafeIt.brand} · 최근 마신 카페`, cafe.opts);
    }
  });
  // 모양을 못 알아봐도 색으로
  const base = {clear:[['soju', '투명한 술', {glass:'soju'}]], gray:[['soju', '투명한 술', {glass:'soju'}]], yellow:[['beer', '노란 술', {glass:'beer'}]], orange:[['beer', '주황빛 술', {glass:'beer'}]],
    brown:[['ame', '갈색 음료'], ['cubalibre', '갈색 칵테일']], dark:[['ame', '어두운 음료']], cream:[['latte', '크림색 음료'], ['baileysmilk', '크림색 칵테일']], red:[['wine', '빨간 술', {glass:'wine'}]],
    green:[['midorisour', '초록빛 칵테일']], blue:[['bluehawaiian', '파란 칵테일']], pink:[['cosmo', '분홍빛 칵테일']], purple:[['cosmo', '보라빛 칵테일']]}[C] || [];
  base.forEach(([id, why, o], i) => add(id, 0.25 - i * 0.05, why, o));

/* 그래프를 누르거나 끌면 그 시각의 값에 점과 상자를 띄워요. 화면마다 그래프 정보를 여기에 둬요. */
const CHARTS = {}; let chartSeq = 0;
function lineChart({pts, x0, x1, yMax, stroke, fill, hlines = [], vmarks = [], dot, label, fmt}) {
  const W = 320, HH = 160, L = 4, R = 4, T = 26, B = 22;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - v / yMax) * (HH - T - B);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  const area = `${line} L${X(pts[pts.length - 1][0]).toFixed(1)} ${Y(0).toFixed(1)} L${X(pts[0][0]).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const id = 'ch' + (++chartSeq); CHARTS[id] = {pts, x0, x1, X, Y, W, HH, T, B, stroke, fmt};
  let s = `<svg viewBox="0 0 ${W} ${HH}" role="img" aria-label="${label}"${fmt ? ` data-ch="${id}"` : ''}>`;
  s += `<path d="${area}" style="fill:${fill}"/><path d="${line}" fill="none" style="stroke:${stroke}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<line x1="${L}" x2="${W - R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" style="stroke:var(--fill-2)" stroke-width="1"/>`;
  // 기준선은 그래프 위에 그리고, 이름은 곡선과 겹치지 않는 자리를 찾아 맨 위에 (테두리를 둘러 가려지지 않게)
  const span = (a, b) => { let lo = Infinity, hi = -Infinity; pts.forEach(p => { const x = X(p[0]); if (x >= a - 3 && x <= b + 3) { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); } }); return [lo, hi]; };
  const place = h => {
    const w = [...h.label].reduce((n, ch) => n + (ch.charCodeAt(0) > 0x2000 ? 11 : 6.5), 0), yb = Y(h.v) - 3, yt = Y(h.v) - 16;
    const ok = [([lo, hi]) => lo === Infinity || Y(hi) > yb + 2, ([lo]) => Y(lo) < yt - 2];   // 1순위: 곡선이 이름 아래 / 2순위: 곡선이 이름 위
    for (const f of ok) for (let x = W - R - 2; x - w >= L + 2; x -= 6) if (f(span(x - w, x))) return x;   // 오른쪽부터
    return W - R - 2;
  };
  let hl = '';
  hlines.forEach(h => { if (h.v <= yMax) { const y = Y(h.v).toFixed(1); s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" style="stroke:${h.color}" stroke-width="1.2" stroke-dasharray="4 4"/>`; hl += `<text class="halo" x="${place(h).toFixed(1)}" y="${(Y(h.v) - 5).toFixed(1)}" text-anchor="end" style="fill:${h.color}">${h.label}</text>`; } });
  // 첫 표시는 아래, 나머지는 위에 라벨 (겹침 방지)
  vmarks.forEach((m, i) => { if (m.t >= x0 && m.t <= x1) { const x = X(m.t); s += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${T - 6}" y2="${Y(0).toFixed(1)}" style="stroke:var(--ink-3)" stroke-width="1" stroke-dasharray="2 3"/><text x="${clamp(x, 34, W - 34).toFixed(1)}" y="${i ? 12 : HH - 5}" text-anchor="middle" style="fill:var(--ink-3)">${m.label} ${hm(m.t)}</text>`; } });
  s += hl;
  if (dot) s += `<circle cx="${X(dot[0]).toFixed(1)}" cy="${Y(dot[1]).toFixed(1)}" r="5" style="fill:${stroke};stroke:var(--fill)" stroke-width="3"/>`;
  return s + '<g class="probe"></g></svg>';
}
function chartAt(c, t) {   // 표시한 점 사이를 이어서 그 시각의 값
  const P = c.pts; if (t <= P[0][0]) return P[0][1];
  for (let i = 1; i < P.length; i++) if (P[i][0] >= t) { const a = P[i - 1], b = P[i], k = b[0] > a[0] ? (t - a[0]) / (b[0] - a[0]) : 0; return a[1] + (b[1] - a[1]) * k; }

function chartProbe(svg, clientX) {
  const c = CHARTS[svg.dataset.ch], g = svg.querySelector('.probe'); if (!c || !g) return;
  const r = svg.getBoundingClientRect(), sx = (clientX - r.left) / r.width * c.W;
  const t = clamp(c.x0 + (sx - c.X(c.x0)) / (c.X(c.x1) - c.X(c.x0)) * (c.x1 - c.x0), c.x0, c.x1), v = Math.max(0, chartAt(c, t));

  g.textContent = '';

  g.appendChild(mk('circle', {cx:x, cy:y, r:5.5, style:`fill:${c.stroke};stroke:var(--card)`, 'stroke-width':3}));
  const tx = mk('text', {class:'pb-t', 'text-anchor':'middle'}); tx.textContent = `${hm(t)} · ${c.fmt(v)}`; g.appendChild(tx);
  const box = mk('rect', {class:'pb-box', rx:8}); g.insertBefore(box, tx);

  box.setAttribute('x', bx); box.setAttribute('y', by); box.setAttribute('width', w); box.setAttribute('height', h);
  tx.setAttribute('x', bx + w / 2); tx.setAttribute('y', by + 16.5);
}
