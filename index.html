<!doctype html>
<html lang="ko">
<head>
<title>기록</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기록">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: native-style screen stack. One question per screen, slide transitions, sticky bottom CTA.
   Home = gray grouped background, white cards with one big sentence each. Coffee brown / soju green as data colors, blue for actions. */
:root{
  --bg:#FFFFFF; --bg-2:#F2F4F6; --card:#FFFFFF; --ink:#191F28; --ink-2:#4E5968; --ink-3:#8B95A1; --line:#E5E8EB;
  --fill:#F2F4F6; --fill-2:#E3E7EB; --accent:#2F6FEB; --accent-soft:#EAF1FE; --on-accent:#FFFFFF; --toast-link:#8AB6FF;
  --caf:#8A5A3B; --caf-soft:#F4ECE6; --alc:#13A26B; --alc-soft:#E2F5EC;
  --warn:#B06A00; --warn-bar:#F5A623; --warn-soft:#FFF4E0; --danger:#E5384A; --danger-soft:#FDEBED;
  --liq-clear:#CFE8F6; --liq-beer:#F4B63C; --liq-foam:#FFF4D4; --liq-wine:#A3203F; --liq-mak:#E9E1CE; --liq-whisky:#C97C2E; --liq-soda:#DDF1E4; --liq-energy:#EBC94B; --liq-green:#7CCB5A; --liq-cream:#E6D3B3; --liq-cola:#5A3A26;
  --shadow:0 10px 30px rgba(0,20,50,.16);
  --f:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17171C; --bg-2:#101013; --card:#1F1F26; --ink:#ECECEF; --ink-2:#B1B1BA; --ink-3:#80808A; --line:#2B2B33;
  --fill:#26262E; --fill-2:#34343E; --accent:#4C8DF6; --accent-soft:#1B2840; --on-accent:#FFFFFF; --toast-link:#2F6FEB;
  --caf:#D3A07A; --caf-soft:#2B221C; --alc:#3CCB8F; --alc-soft:#14291F;
  --warn:#FFB547; --warn-bar:#F5A623; --warn-soft:#30260F; --danger:#FF5D6C; --danger-soft:#3A1C21;
  --liq-clear:#36566A; --liq-beer:#D99A22; --liq-foam:#EADFC2; --liq-wine:#B8344F; --liq-mak:#8A826E; --liq-whisky:#B06A22; --liq-soda:#2F5747; --liq-energy:#B8962B; --liq-green:#4E9A36; --liq-cream:#9C8763; --liq-cola:#7A5238;
  --shadow:0 10px 30px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17171C; --bg-2:#101013; --card:#1F1F26; --ink:#ECECEF; --ink-2:#B1B1BA; --ink-3:#80808A; --line:#2B2B33;
  --fill:#26262E; --fill-2:#34343E; --accent:#4C8DF6; --accent-soft:#1B2840; --on-accent:#FFFFFF; --toast-link:#2F6FEB;
  --caf:#D3A07A; --caf-soft:#2B221C; --alc:#3CCB8F; --alc-soft:#14291F;
  --warn:#FFB547; --warn-bar:#F5A623; --warn-soft:#30260F; --danger:#FF5D6C; --danger-soft:#3A1C21;
  --liq-clear:#36566A; --liq-beer:#D99A22; --liq-foam:#EADFC2; --liq-wine:#B8344F; --liq-mak:#8A826E; --liq-whisky:#B06A22; --liq-soda:#2F5747; --liq-energy:#B8962B; --liq-green:#4E9A36; --liq-cream:#9C8763; --liq-cola:#7A5238;
  --shadow:0 10px 30px rgba(0,0,0,.55); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%}
body{height:100%;margin:0;overflow:hidden;background:var(--bg-2);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
input{font:inherit;color:inherit;letter-spacing:inherit}
p,h1,h2,h3{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

#root{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:500px){#root{box-shadow:0 0 0 1px var(--line)}}
#stage{position:absolute;inset:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;background:var(--bg);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.screen.tabscr{z-index:1;background:var(--bg-2);padding-bottom:100px}
.screen.flow{z-index:10}

/* top bar */
.bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;min-height:56px;margin:0 -10px;background:var(--bg)}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:active{background:var(--fill)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px;color:var(--ink-3)}
.icon-sp{width:44px;flex:none}
.prog{flex:1;height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin:0 12px}
.prog i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.sp{flex:1}

/* type */
.eyebrow{font-size:15px;font-weight:700;color:var(--accent);margin-top:20px}
.eyebrow.caf{color:var(--caf)} .eyebrow.alc{color:var(--alc)}
.eyebrow + .h{margin-top:6px}
.h{font-size:26px;line-height:1.42;font-weight:700;letter-spacing:-.025em;margin-top:20px;text-wrap:balance}
.h .num{font-variant-numeric:tabular-nums;color:var(--accent)}
.h .num.caf{color:var(--caf)} .h .num.alc{color:var(--alc)}
.sub{font-size:16px;line-height:1.6;color:var(--ink-2);margin-top:10px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;margin-block:auto}
.center .h{margin-top:24px}

/* options */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:32px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:16px 20px;border-radius:16px;background:var(--fill);font-size:17px;font-weight:600;transition:background-color .15s,box-shadow .15s,transform .12s}
.opt:active{transform:scale(.985)}
.opt-t{flex:1;min-width:0}
.opt small{display:block;font-size:14px;font-weight:400;color:var(--ink-3);margin-top:2px}
.opt .r{flex:none;font-size:16px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt[aria-pressed="true"] small,.opt[aria-pressed="true"] .r{color:var(--accent)}
.ck{flex:none;width:26px;height:26px;border-radius:50%;background:var(--fill-2);color:var(--fill);display:grid;place-items:center;transition:background-color .15s,color .15s}
.opt[aria-pressed="true"] .ck{background:var(--accent);color:var(--on-accent)}

/* inputs */
.big-in{display:flex;align-items:baseline;gap:8px;margin-top:44px;padding-bottom:10px;border-bottom:2px solid var(--line);transition:border-color .2s;cursor:text}
.big-in:focus-within{border-color:var(--accent)}
.big-in input{flex:0 1 auto;min-width:1.2ch;width:2.4ch;max-width:100%;border:0;background:none;outline:none;padding:0;font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big-in input::placeholder{color:var(--fill-2)}
.big-in span{font-size:24px;font-weight:700;color:var(--ink-2)}
.big-in.sm{margin-top:36px} .big-in.sm input{font-size:32px} .big-in.sm span{font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.err{color:var(--danger);font-size:14px;margin-top:8px}
.field{display:block;margin-top:28px}
.field > span{display:block;font-size:14px;font-weight:600;color:var(--ink-3);margin-bottom:8px}
.text-in{width:100%;height:52px;padding:0 16px;border-radius:14px;border:0;background:var(--fill);font-size:16px;outline:none}
.text-in:focus{box-shadow:inset 0 0 0 2px var(--accent)}

/* cta */
.cta{position:sticky;bottom:0;z-index:2;margin-top:auto;padding:28px 0 16px;background:linear-gradient(to top,var(--bg) 72%,transparent)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:700;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.3;cursor:default;transform:none}
.btn.sec{background:var(--fill);color:var(--ink);margin:0;font-size:17px;letter-spacing:inherit;align-items:center;gap:0}
.btn.warn{background:var(--danger)}
.btn-row{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.txt-btn{display:block;margin:10px auto 0;padding:8px 14px;font-size:15px;font-weight:600;color:var(--ink-3);text-align:center}
.cta-note{text-align:center;font-size:14px;color:var(--ink-3);margin-top:12px}

/* welcome */
.welcome{padding-top:36px}
.hero{display:flex;align-items:flex-end;gap:16px;height:140px}
.hb{position:relative;width:76px;height:124px;border:3px solid var(--ink);border-top:0;border-radius:0 0 22px 22px;overflow:hidden}
.hb.sm{width:54px;height:86px;border-radius:0 0 16px 16px}
.hb::after{content:"";position:absolute;left:0;right:0;top:24%;border-top:2px dashed var(--danger)}
.hl{position:absolute;left:0;right:0;bottom:0}
.hl.caf{background:var(--caf)} .hl.alc{background:var(--alc)}

/* result */
.cups{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-top:28px}
.mini{position:relative;width:30px;height:40px;border:2.5px solid var(--ink-3);border-top:0;border-radius:0 0 9px 9px;overflow:hidden}
.mini i{position:absolute;left:0;right:0;bottom:0}
.mini.caf i{background:var(--caf)} .mini.alc i{background:var(--alc)}
.reason{margin-top:24px;padding:16px 18px;border-radius:16px;background:var(--fill);font-size:15px;line-height:1.55;color:var(--ink-2)}
.why{margin-top:10px}
.why summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:2px;font-size:15px;font-weight:600;color:var(--ink-3);padding:8px 2px}
.why summary::-webkit-details-marker{display:none}
.why summary svg{transition:transform .2s}
.why[open] summary svg{transform:rotate(90deg)}
.factors{list-style:none;margin:2px 0 0;padding:0}
.factors li{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink-2)}
.factors li span:last-child{font-weight:600;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.factors li.total{font-weight:700;color:var(--ink)}
.spinner{width:48px;height:48px;border-radius:50%;border:4px solid var(--fill);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.res-ic{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.res-ic.soft{background:var(--accent-soft);color:var(--accent)}
.res-ic .draw{stroke-dasharray:20}

/* record flow */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:32px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:20px 18px 18px;border-radius:22px;background:var(--fill);min-height:156px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin-bottom:auto}
.tile.caf .tile-ic{background:var(--caf-soft);color:var(--caf)}
.tile.alc .tile-ic{background:var(--alc-soft);color:var(--alc)}
.tile b{font-size:18px;font-weight:700;margin-top:16px}
.tile small{font-size:13.5px;color:var(--ink-3)}
.sec2{font-size:15px;font-weight:700;color:var(--ink-3);margin-top:32px}
.rows{display:flex;flex-direction:column;margin:8px -12px 0}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;border-radius:14px;transition:background-color .12s}
.row:hover,.row:active{background:var(--fill)}
.row-t{flex:1;min-width:0}
.row-t b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-t small{display:block;font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{flex:none;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.row-r.caf{color:var(--caf)} .row-r.alc{color:var(--alc)}
.row-r small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-3)}
.none{padding:20px 12px;color:var(--ink-3);font-size:15px}
.ghost{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;padding:15px;border-radius:16px;font-size:15px;font-weight:600;color:var(--ink-2);background:var(--fill);cursor:pointer;width:100%}
.ghost:active{background:var(--fill-2)}
.search{position:relative;margin-top:24px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;height:50px;padding:0 16px 0 44px;border-radius:14px;border:0;background:var(--fill);font-size:16px;outline:none}
.search input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips.center{justify-content:center;margin-top:28px}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-size:14.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.photo{display:flex;align-items:center;gap:12px;margin-top:20px;padding:10px;border-radius:16px;background:var(--fill)}
.photo img{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none}
.photo p{flex:1;font-size:14px;color:var(--ink-2);line-height:1.45}
.recipe{margin-top:28px;border-radius:20px;background:var(--fill);padding:6px 18px}
.rc{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.rc:first-child{border-top:0}
.rc span:first-child{flex:1}
.rc .n{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.rc .g{width:56px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rc.total{font-weight:700;color:var(--alc)}
.qty{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:56px}
.qbtn{width:56px;height:56px;border-radius:50%;background:var(--fill);font-size:28px;font-weight:500;display:grid;place-items:center;transition:transform .12s,opacity .2s}
.qbtn:active{transform:scale(.92)}
.qbtn:disabled{opacity:.3}
.qval{min-width:110px;text-align:center}
.qval b{display:inline-block;font-size:56px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.qval span{font-size:22px;font-weight:700;color:var(--ink-2);margin-left:4px}
.qsum{text-align:center;margin-top:16px;font-size:16px;color:var(--ink-2);font-weight:600}
.other{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:12px 16px 12px 20px;border-radius:16px;border:1.5px dashed var(--line)}
.other span{flex:1;font-size:15px;font-weight:600;color:var(--ink-2)}
.other input{height:36px;padding:0 10px;border-radius:10px;border:0;background:var(--fill);font-size:15px;font-weight:600}
.vis{margin-top:28px;padding:20px;border-radius:20px;background:var(--fill)}
.vis-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14.5px;color:var(--ink-3)}
.vis-row b{font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.vis-row b.over{color:var(--danger)}
.vis-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.gauge{position:relative;display:block;height:12px;border-radius:6px;background:var(--fill-2);margin-top:12px;overflow:hidden}
.card .gauge{background:var(--fill);margin-top:18px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.gauge i.prev{opacity:.3}
.alist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.al{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:16px;font-size:15px;line-height:1.5;background:var(--warn-soft);color:var(--warn)}
.al.danger{background:var(--danger-soft);color:var(--danger)}
.al svg{flex:none;margin-top:1px}
.tip{margin-top:12px;font-size:15px;color:var(--ink-2);text-align:center}

/* home / tabs */
.home{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.htop{display:flex;justify-content:space-between;align-items:center;min-height:60px;padding-top:4px}
.logo{font-size:23px;font-weight:800;letter-spacing:-.05em}
.hdate{font-size:14px;font-weight:600;color:var(--ink-3)}
.tab-h{font-size:26px;font-weight:800;letter-spacing:-.03em;padding-top:20px;padding-bottom:4px}
.card{display:block;width:100%;background:var(--card);border-radius:24px;padding:22px 22px 20px;text-align:left}
button.card{transition:transform .12s}
button.card:active{transform:scale(.985)}
.c-label{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:var(--ink-2)}
.c-label > svg,.c-label .score{margin-left:auto}
.c-label > svg{color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.c-big{display:block;font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.32;margin-top:8px;font-variant-numeric:tabular-nums}
.c-big.over{color:var(--danger)}
.c-sub{display:block;font-size:15px;color:var(--ink-3);margin-top:2px}
.c-foot{display:flex;justify-content:space-between;margin-top:10px;font-size:13.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.c-extra{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.c-extra b{font-weight:700;font-variant-numeric:tabular-nums}
.prompt{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:24px;padding:18px 18px 18px 20px;text-align:left;transition:transform .12s}
.prompt:active{transform:scale(.985)}
.prompt .pi{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.prompt .pt{flex:1;min-width:0}
.prompt b{display:block;font-size:16px;font-weight:700}
.prompt small{display:block;font-size:14px;color:var(--ink-3)}
.prompt > svg{color:var(--ink-3);flex:none}
.banner{display:flex;gap:10px;align-items:flex-start;padding:16px 18px;border-radius:20px;background:var(--warn-soft);color:var(--warn);font-size:15px;line-height:1.5;font-weight:500}
.banner.danger{background:var(--danger-soft);color:var(--danger)}
.banner svg{flex:none;margin-top:1px}
.banner small{display:block;font-size:13px;opacity:.85;margin-top:2px}
.sec{display:flex;align-items:baseline;gap:8px;font-size:18px;font-weight:700;margin:14px 4px 0;letter-spacing:-.02em}
.sec small{font-size:14px;font-weight:500;color:var(--ink-3)}
.qrow{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.qrow::-webkit-scrollbar{display:none}
.qchip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border-radius:18px;background:var(--card);max-width:200px;text-align:left;transition:transform .12s}
.qchip:active{transform:scale(.96)}
.qchip b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:168px}
.qchip small{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:168px}
.plus{font-weight:700}

        opts('smoke', d.smoke, [{v:'none', t:'안 피워요'}, {v:'some', t:'가끔 피워요'}, {v:'daily', t:'매일 피워요', s:'전자담배 포함'}])}),
    meds: d => ({html: bar({prog:obProg(d, 'meds')}) + head('평소 먹는 약이 있나요?', '카페인이나 술과 같이 조심해야 하는 약이에요. 해당하는 걸 모두 골라 주세요.') +
        `<div class="opts">${Object.entries(MEDS_Q).map(([k, l]) => `<button class="opt" data-a="med" data-v="${k}" aria-pressed="${d.meds.includes(k)}" data-in><span class="opt-t">${l}</span><span class="ck">${I.check}</span></button>`).join('')}</div>` +
        cta(`<button class="btn" data-a="ob-meds-next" id="meds-btn">${d.meds.length ? '다음' : '없어요, 다음'}</button>`)}),
    bed: d => ({html: bar({prog:obProg(d, 'bed')}) + head('보통 몇 시쯤 주무세요?', '잘 때 몸에 카페인이 얼마나 남는지 알려 드릴게요.') +
        opts('bed', d.bed, [{v:'23:00', t:'밤 11시'}, {v:'00:00', t:'밤 12시'}, {v:'01:00', t:'새벽 1시'}, {v:'02:00', t:'새벽 2시'}, {v:'03:00', t:'새벽 3시 이후'}])}),
    flush: d => ({html: bar({prog:obProg(d, 'flush')}) + head('술 마시면 얼굴이<br>빨개지는 편인가요?', '금방 빨개진다면 알코올을 분해하는 효소(ALDH2)가 약할 수 있어요. 같은 양도 몸에 더 부담이 돼요.') +
        opts('flush', d.flush, [{v:'often', t:'한두 잔에도 빨개져요'}, {v:'some', t:'많이 마시면 빨개져요'}, {v:'none', t:'거의 안 빨개져요'}])}),
    calc: () => ({html:`<div class="center"><div class="spinner" aria-hidden="true" data-in></div><h1 class="h" data-in>권장량을 계산하고 있어요</h1><p class="sub" data-in>공개 기준에 답변을 반영하는 중이에요</p></div>`,
      mount:(el, re) => { if (re) return; const f = ui.flow; setTimeout(() => { if (ui.flow === f && f.cur === 'calc') { f.cur = 'resCaf'; paintFlow('fwd'); } }, 1500); }}),
    resCaf: d => {
      const p = normProfile(d), ci = cafInfo(p), hrs = Math.round(ci.half * Math.log2(AME_MG / ci.bedR));
      const parts = ['몸무게', ...(p.adult ? [] : ['청소년 기준']), ...(p.pregnant ? ['임신·수유'] : []), '카페인 민감도', ...(p.conds.length ? ['평소 증상'] : []), ...(p.smoke !== 'none' ? ['흡연'] : []), ...(p.meds.length ? ['먹는 약'] : [])];
      const reason = `${josa(parts.join(', '), '을', '를')} 반영했어요. 아메리카노 한 잔은 잠들기 ${hrs}시간 전까지 마시는 게 좋아요.`;
      return {html: bar({}) + head(`하루 카페인은<br><span class="num caf" data-count="${ci.limit}">${ci.limit}</span>mg까지 괜찮아요`, `아메리카노로 치면 ${fmt1(ci.limit / AME_MG)}잔 정도예요.`, '카페인', 'caf') +
        cupRow(ci.limit / AME_MG, 'caf') + `<p class="reason" data-in>${esc(reason)}</p>` + why(ci) +
        (p.adult ? cta(btn('다음', 'ob-to-alc')) : finishCta(d))};
    },
    resAlc: d => {
      const p = normProfile(d), ai = alcInfo(p), g03 = 0.03 * tbw(p) / 0.08 / 0.8;
      const parts = ['키·몸무게·나이', ...(p.sex === 'x' ? ['보수적인 기준'] : []), ...(p.flush !== 'none' ? ['얼굴이 빨개지는 정도'] : []), ...(p.meds.length ? ['먹는 약'] : [])];
      const reason = `${josa(parts.join(', '), '을', '를')} 반영했어요. 빨리 마시면 소주 ${fmt1(g03 / SOJU_G)}잔쯤에 운전 금지 기준(0.03%)에 닿아요.`;
      return {html: bar({}) + head(`술은 하루<br><span class="num alc" data-count="${ai.limit}" data-dec="1">${ai.limit}</span>g까지가 좋아요`, `소주로 치면 ${fmt1(ai.limit / SOJU_G)}잔 정도예요.`, '알코올', 'alc') +
        cupRow(ai.limit / SOJU_G, 'alc') + `<p class="reason" data-in>${esc(reason)}</p>` + why(ai) + finishCta(d)};
    },
  },

  /* ----- 기록하기: 고르기 → 한 화면에서 양·시간 정하고 바로 기록 ----- */
  rec: {
    pick: d => {
      const adult = !alcInfo().disabled;
      return {html: bar({back:false, close:true}) + head('무엇을 마셨나요?') + photoBanner(d) +
        (adult ? `<div class="seg" data-in>${[['caf', '카페인'], ['alc', '술']].map(([v, t]) => `<button data-a="rk" data-v="${v}" aria-pressed="${d.k === v}">${t}</button>`).join('')}</div>` : '') +
        `<div class="search" data-in>${I.search}<input id="q" type="search" placeholder="메뉴·브랜드 검색 (메가 아아, ㅅㅁ…)" value="${esc(d.q || '')}" autocomplete="off" aria-label="메뉴 검색"></div>
         <div id="plist" data-in>${pickBody(d)}</div>
         <button class="ghost" data-a="rcustom" data-in>찾는 게 없어요 · 직접 입력</button>
         ${d.photo ? '' : `<label class="ghost" for="photo" data-in style="margin-top:8px">${I.camera}사진 붙이기</label><input id="photo" type="file" accept="image/*" capture="environment" hidden>`}
         <p class="disc" data-in style="margin-top:16px">브랜드 음료 카페인은 스타벅스·메가커피·컴포즈커피·빽다방·이디야 홈페이지에 공개된 값이에요(2026년 11월 기준, 스타벅스는 Tall). 기본 음료·술 도수·칵테일 레시피는 일반적인 값이에요.</p>`};
    },
    item: d => {
      const it = d.custom ? null : BYID[d.id], k = d.custom ? d.k : it.k, fav = isFav(d);
      const eb = d.custom ? '직접 입력' : it.brand || it.cat, title = d.custom ? (k === 'caf' ? '카페인 음료' : '술') : it.name;
      const body = d.custom ? customHTML(d) : it.k === 'caf' ? cafPick(d, it) : it.recipe ? recipeBody(it) : `<div id="gsec">${glassHTML(d, it)}</div>`;
      const x = pvData(d);
      return {html: bar({close:true}) +
        `<div class="ttl" data-in><div class="ttl-t"><p class="eyebrow ${k}">${esc(eb)}</p><h1 class="h">${esc(title)}</h1></div><button class="icon-btn star" data-a="fav" aria-pressed="${fav}" aria-label="즐겨찾기">${fav ? I.starOn : I.star}</button></div>` +
        photoBanner(d) + body + panelHTML(d, it) + `<div id="pv" data-in>${pvHTML(x)}</div>` + ctaHTML(x),
        mount:(el, re) => { if (re || !d.custom) return; const i = el.querySelector('#cu-mg, #cu-ml'); if (i && !i.value) setTimeout(() => { if (cur === el) try { i.focus({preventScroll:true}); } catch (e) {} }, DUR + 80); }};
    },
    favs: () => favList(),
  },
  fav: {list: () => favList()},
  day: {view: d => vDay(d)},

  /* ----- 다음 날 피드백 ----- */
  fb: {
    ask: d => {
      const p = d.queue[d.i], caf = p.kind === 'caf', lbl = dayLabel(p.day), info = caf ? cafInfo() : alcInfo();
      const h = caf ? `${lbl} 아메리카노 ${fmt1(p.amt / AME_MG)}잔만큼<br>카페인을 드셨어요` : `${lbl} 소주 ${fmt1(p.amt / SOJU_G)}잔만큼<br>술을 드셨어요`;
      const sub = `${caf ? Math.round(p.amt) + 'mg' : fmt1(p.amt) + 'g'}, 권장량의 ${Math.round(p.amt / info.limit * 100)}%였어요. ${caf ? '몸은 어떠셨어요?' : '다음 날 몸은 어떠셨어요?'}`;
      return {html: bar({back:false, close:true, prog:d.queue.length > 1 ? (d.i + 1) / d.queue.length : null}) + head(h, sub, caf ? '카페인' : '알코올', caf ? 'caf' : 'alc') +
        `<div class="opts">${FB[p.kind].map(o => `<button class="opt" data-a="fbans" data-v="${o[0]}" aria-pressed="false" data-in><span class="opt-t">${o[1]}</span></button>`).join('')}</div>
         <button class="txt-btn" data-a="fbans" data-v="skip" data-in>잘 모르겠어요</button>`};
    },
    res: d => {
      const r = d.res, caf = r.kind === 'caf', unit = caf ? 'mg' : 'g', diff = caf ? Math.round(r.before - r.after) : fmt1(r.before - r.after);
      let h, sub, ic = I.done;
      if (r.ans === 'skip') { h = '괜찮아요,<br>다음에 알려 주세요'; sub = '기준은 그대로 둘게요.'; }
      else if (r.after < r.before) {
        h = `다음부터 하루<br><span class="num" data-count="${r.after}" data-from="${r.before}" ${caf ? '' : 'data-dec="1"'}>${r.after}</span>${unit}까지로 맞출게요`;
        sub = r.ans === 'blackout' ? '기억이 끊길 정도면 몸이 감당하기 어려운 양이었어요. 기준을 많이 낮췄어요.' : `전보다 ${diff}${unit} 낮췄어요. 답해 주실수록 내 몸에 맞게 조정돼요.`;
      } else if (r.after > r.before) { h = `괜찮으셨군요.<br>기준을 ${r.after}${unit}으로 조금 올릴게요`; sub = '그래도 공개 기준보다 높아지지는 않아요.'; }
      else { h = '지금 기준이<br>잘 맞는 것 같아요'; sub = r.capped ? '이미 공개 기준 최대치라 그대로 둘게요.' : '이번엔 기준을 바꾸지 않을게요.'; }
      const more = d.i + 1 < d.queue.length;
      return {html: bar({back:false, close:true}) + `<div class="center"><div class="res-ic">${ic}</div>` + head(h, sub) + '</div>' + cta(btn(more ? '다음' : '확인', more ? 'fb-next' : 'fb-close'))};
    },
  },

  /* ----- 자세히 보기 ----- */
  det: {
    caf: () => {
      const now = Date.now(), st = status();
      const recs = S.records.filter(r => r.caf > 0 && now - r.t < 24 * H).sort((a, b) => b.t - a.t);
      const first = recs.length ? recs[recs.length - 1].t : now - 2 * H;
      const x0 = Math.max(now - 10 * H, Math.min(first, now - 2 * H)), x1 = Math.max(now + 2 * H, Math.min(st.bed + H, now + 14 * H));
      const pts = []; for (let i = 0; i <= 90; i++) { const t = x0 + (x1 - x0) * i / 90; pts.push([t, cafBody(t)]); }
      const yMax = Math.max(st.ci.bedR * 2, ...pts.map(p => p[1])) * 1.15;
      const ch = lineChart({pts, x0, x1, yMax, stroke:'var(--caf)', fill:'var(--caf-soft)', hlines:[{v:st.ci.bedR, label:'잠에 영향', color:'var(--warn)'}],
        vmarks:[{t:now, label:'지금'}, {t:st.bed, label:'취침'}], dot:[now, st.body], label:'체내 카페인 추정 그래프'});
      return {html: bar({}) + head(st.body >= 5 ? `지금 몸에 카페인이<br>${Math.round(st.body)}mg 남아 있어요` : '지금 몸에 남은<br>카페인이 거의 없어요',
          `${timeLabel(st.bed)}에 잘 때쯤 ${Math.round(st.atBed)}mg 남아요.${st.atBed >= 100 ? ' 잠들기 어려울 수 있어요.' : ''}`, '카페인', 'caf') +
        `<div class="chart" data-in>${ch}<p class="chart-note">내 몸이 카페인을 분해하는 속도로 계산한 추정치예요. 잘 때 점선보다 높게 남으면 잠이 얕아질 수 있어요.</p></div>
         <h2 class="sec2" data-in>최근 24시간 기록</h2><div class="rlist" data-in>${recs.map(recRow).join('') || '<p class="none">아직 기록이 없어요</p>'}</div>`};
    },
    alc: () => {
      const now = Date.now(), st = status(), b = st.bac;
      const recs = S.records.filter(r => r.alc > 0 && now - r.t < 24 * H).sort((a, b2) => b2.t - a.t);
      let ch = '';
      if (b.any && b.series.length > 1) {
        // 지금 이어지는 술자리만: 지금 이전에서 마지막으로 0%였던 시점부터
        let i = b.series.findIndex(p => p[0] > now); if (i < 0) i = b.series.length; i--;
        while (i > 0 && b.series[i][1] > 0) i--;
        const x0 = Math.min(b.series[Math.max(0, i)][0], now - 30 * MIN), x1 = Math.max(now + H, (b.soberAt || now) + 20 * MIN);
        const pts = b.series.filter(p => p[0] >= x0 && p[0] <= x1); if (!pts.length || pts[0][0] > x0) pts.unshift([x0, 0]); if (pts[pts.length - 1][0] < x1) pts.push([x1, 0]);
        const yMax = Math.max(0.04, Math.max(...pts.map(p => p[1])) * 1.25);
        ch = `<div class="chart" data-in>${lineChart({pts, x0, x1, yMax, stroke:'var(--alc)', fill:'var(--alc-soft)',
          hlines:[{v:0.03, label:'0.03% 면허정지', color:'var(--warn)'}, {v:0.08, label:'0.08% 면허취소', color:'var(--danger)'}],
          vmarks:[{t:now, label:'지금'}].concat(b.soberAt ? [{t:b.soberAt, label:'0%'}] : []), dot:[now, b.now], label:'혈중알코올 추정 그래프'})}
          <p class="chart-note">내 체수분과 마신 시간, 안주 여부로 계산한 추정치예요. 실제와 다를 수 있으니 운전 판단에 쓰지 마세요.</p></div>`;
      }
      const h = b.now >= 0.0005 ? `지금 혈중알코올은<br>${b.now.toFixed(3)}%예요` : b.ahead > 0 ? '곧 술기운이<br>올라올 거예요' : '지금은 술기운이<br>없어요';
      const sub = b.soberAt ? `${timeLabel(b.soberAt)}쯤 0%가 돼요.${b.ahead >= 0.03 ? ' 그 전엔 운전하면 안 돼요.' : ''}` : '최근 24시간 동안 남아 있는 술기운이 없어요.';
      return {html: bar({}) + head(h, sub, '알코올', 'alc') + ch +
        `<h2 class="sec2" data-in>최근 24시간 기록</h2><div class="rlist" data-in>${recs.map(recRow).join('') || '<p class="none">아직 기록이 없어요</p>'}</div>`};
    },
  },

  /* ----- 데이터 지우기 ----- */
  reset: {
    confirm: () => ({html: bar({back:false, close:true}) + head('모든 기록과 설정을<br>지울까요?', '지운 기록은 되돌릴 수 없어요. 처음 설정부터 다시 시작해요.') +
      cta('<div class="btn-row"><button class="btn sec" data-a="close">취소</button><button class="btn warn" data-a="reset-do">모두 지우기</button></div>')}),
  },
};

function recRow(r) {
  return `<div class="rrow"><span class="rt">${hm(r.t)}</span>${r.photo ? `<img src="${r.photo}" alt="">` : ''}<span class="row-t"><b>${esc(r.name)}${r.demo ? '<span class="tag">예시</span>' : ''}</b><small>${esc(r.sub)}</small></span><span class="row-r ${r.alc > 0 ? 'alc' : 'caf'}">${r.alc > 0 ? fmt1(r.alc) + 'g' : Math.round(r.caf) + 'mg'}</span><button class="icon-btn sm" data-a="del" data-id="${r.id}" aria-label="${esc(r.name)} 기록 삭제">${I.xs}</button></div>`;
}
function lineChart({pts, x0, x1, yMax, stroke, fill, hlines = [], vmarks = [], dot, label}) {
  const W = 320, HH = 160, L = 4, R = 4, T = 26, B = 22;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - v / yMax) * (HH - T - B);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  const area = `${line} L${X(pts[pts.length - 1][0]).toFixed(1)} ${Y(0).toFixed(1)} L${X(pts[0][0]).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  let s = `<svg viewBox="0 0 ${W} ${HH}" role="img" aria-label="${label}">`;
  hlines.forEach(h => { if (h.v <= yMax) { const y = Y(h.v).toFixed(1); s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" style="stroke:${h.color}" stroke-width="1" stroke-dasharray="4 4"/><text x="${L + 2}" y="${(Y(h.v) - 5).toFixed(1)}" style="fill:${h.color}">${h.label}</text>`; } });
  s += `<path d="${area}" style="fill:${fill}"/><path d="${line}" fill="none" style="stroke:${stroke}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<line x1="${L}" x2="${W - R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" style="stroke:var(--fill-2)" stroke-width="1"/>`;
  // 첫 표시는 아래, 나머지는 위에 라벨 (겹침 방지)
  vmarks.forEach((m, i) => { if (m.t >= x0 && m.t <= x1) { const x = X(m.t); s += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${T - 6}" y2="${Y(0).toFixed(1)}" style="stroke:var(--ink-3)" stroke-width="1" stroke-dasharray="2 3"/><text x="${clamp(x, 34, W - 34).toFixed(1)}" y="${i ? 12 : HH - 5}" text-anchor="middle" style="fill:var(--ink-3)">${m.label} ${hm(m.t)}</text>`; } });
  if (dot) s += `<circle cx="${X(dot[0]).toFixed(1)}" cy="${Y(dot[1]).toFixed(1)}" r="5" style="fill:${stroke};stroke:var(--fill)" stroke-width="3"/>`;
  return s + '</svg>';
}

/* =========================================================
   탭 화면
   ========================================================= */
function gaugeCard(k, st) {
  const caf = k === 'caf', val = caf ? st.caf : st.alc, lim = caf ? st.ci.limit : st.ai.limit, unit = caf ? 'mg' : 'g';
  const f = v => caf ? Math.round(v) : fmt1(v), left = lim - val, over = left < 0;
  const big = over ? `권장량을 ${f(-left)}${unit} 넘었어요` : `${f(left)}${unit} 남았어요`;
  const more = left / (caf ? AME_MG : SOJU_G);
  const sub = over ? (caf ? '오늘 카페인은 여기까지만 해요' : '오늘은 그만 마시고 물 한 잔 어때요?')
    : `${caf ? '아메리카노' : '소주'} ${more >= 0.5 ? halfFloor(more) + '잔 정도 더 괜찮아요' : '반 잔도 안 남았어요'}`;
  const pct = Math.min(100, val / lim * 100), from = ui.lastPct[k]; ui.lastPct[k] = pct;
  let extra = '';
  if (!caf && st.bac.any && st.bac.ahead > 0) extra = `<span class="c-extra"><span>혈중알코올 <b>${st.bac.now >= 0.0005 ? st.bac.now.toFixed(3) + '%' : '오르는 중'}</b></span><span>${st.bac.soberAt ? timeLabel(st.bac.soberAt) + '쯤 0%' : ''}</span></span>`;

  tab: el => { if (ui.tab === el.dataset.t && !ui.flow) return; ui.tab = el.dataset.t; paintTab('fade'); },
  'tab-rec': () => startFlow('rec', 'pick', {k:defaultKind(), cat:'커피', q:'', qty:1, ago:0}, 'up'),
  // 처음 설정
  'ob-start': () => go('body'),
  'ob-w-next': () => {
    const f = ui.flow;
    if (!validBody(f.d)) { const e = cur.querySelector('#ob-w-err'); if (e) e.hidden = false; return; }
    f.d.weight = Math.round(Number(f.d.weight) * 10) / 10; f.d.height = Math.round(Number(f.d.height)); go(obNext(f.d, 'body'));
  },
  'ob-b-next': () => {
    const f = ui.flow; if (!validB(f.d.birth)) { const e = cur.querySelector('#ob-b-err'); if (e) e.hidden = false; return; }
    f.d.birth = Number(f.d.birth); f.d.adult = THIS_YEAR - f.d.birth >= 19; go(obNext(f.d, 'birth'));
  },
  med: el => {
    const c = ui.flow.d.meds, v = el.dataset.v, i = c.indexOf(v);
    if (i < 0) c.push(v); else c.splice(i, 1);
    el.setAttribute('aria-pressed', String(i < 0));
    const b = cur.querySelector('#meds-btn'); if (b) b.textContent = c.length ? '다음' : '없어요, 다음';
  },
  'ob-meds-next': () => go(obNext(ui.flow.d, 'meds')),
  opt: el => {
    const f = ui.flow; if (!f || f.busy) return;
    const k = el.dataset.k, v = PARSE(el.dataset.v);
    f.d[k] = v; if (k === 'ago') f.d.time = null; if (k === 'sex' && v === 'm') f.d.pregnant = false;
    el.parentNode.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    f.busy = true;
    setTimeout(() => { f.busy = false; if (ui.flow !== f) return; const nx = NEXT[f.kind](f.d, f.cur); if (nx) go(nx); }, 220);
  },
  cond: el => {
    const c = ui.flow.d.conds, v = el.dataset.v, i = c.indexOf(v);
    if (i < 0) c.push(v); else c.splice(i, 1);
    el.setAttribute('aria-pressed', String(i < 0));
    const b = cur.querySelector('#conds-btn'); if (b) b.textContent = c.length ? '다음' : '없어요, 다음';
  },
  'ob-conds-next': () => go(obNext(ui.flow.d, 'conds')),
  'ob-to-alc': () => go('resAlc'),
  'ob-finish': el => {
    const d = ui.flow.d, edit = d.edit;
    S.profile = normProfile(d);
    if (!S.profile.adult) S.records = S.records.filter(r => !(r.alc > 0));
    save(); ui.flow = null; ui.tab = edit ? 'me' : 'home';
    if (el.dataset.seed) seed();
    ui.lastPct = {caf:0, alc:0};
    paintTab(edit ? 'back' : 'fwd');
    toast(edit ? '새 기준으로 다시 계산했어요' : el.dataset.seed ? '예시 기록을 넣었어요. 어제 기록에 답해 보세요' : '준비됐어요. 마신 걸 기록해 보세요');
  },
  // 기록하기
  rk: el => {
    const d = ui.flow.d; if (d.k === el.dataset.v) return;
    d.k = el.dataset.v; d.q = ''; const q = cur.querySelector('#q'); if (q) q.value = '';
    cur.querySelectorAll('[data-a="rk"]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    const pl = cur.querySelector('#plist'); pl.innerHTML = pickBody(d);
    anim(pl, [{opacity:0, transform:'translateY(8px)'}, {opacity:1, transform:'none'}], {duration:260});
  },
  cat: el => {
    const d = ui.flow.d, sl = el.parentNode.scrollLeft; d.cat = el.dataset.v;
    cur.querySelector('#plist').innerHTML = pickBody(d);
    const hs = cur.querySelector('#plist .hscroll'); if (hs) hs.scrollLeft = sl;
  },
  ritem: el => { const it = BYID[el.dataset.id]; if (it) openItem(it); },
  rtpl: el => {
    if (el.dataset.fav) {
      const f = S.favs.find(x => x.key === el.dataset.fav); if (!f) return;
      if (f.itemId && BYID[f.itemId]) openItem(BYID[f.itemId], f.opts); else if (f.custom) openCustom(f.custom);
      return;
    }
    const r = S.records.find(x => x.id === el.dataset.rid); if (!r) return;
    if (r.itemId && BYID[r.itemId]) openItem(BYID[r.itemId], r.opts); else openCustom(customOf(r));
  },
  rcustom: () => { const d = ui.flow.d; openCustom({k:d.k || 'caf', name:(d.q || '').trim()}); },
  ck: el => { ui.flow.d.k = el.dataset.v; swapCur(); },
  vsel: el => { ui.flow.d.o.size = Number(el.dataset.v); cur.querySelectorAll('[data-a="vsel"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); updPv(); },
  sh: el => { const d = ui.flow.d; d.o.shots = clamp((d.o.shots || 0) + Number(el.dataset.d), 0, 4); updPanel('#sv'); updPv(); },
  qty: el => { const d = ui.flow.d; d.qty = clamp((d.qty || 1) + Number(el.dataset.d) * 0.5, 0.5, 10); updPanel('#qv'); updPv(); },
  when: el => { const d = ui.flow.d; d.ago = Number(el.dataset.v); d.time = null; updPanel(); updPv(); },
  gsel: el => {
    const d = ui.flow.d, it = BYID[d.id]; if (d.o.glass === el.dataset.v) return;
    const sl = el.parentNode.scrollLeft; d.o = glassOpts(it, el.dataset.v, d.o); swapCur();
    const hs = cur.querySelector('.gsel'); if (hs) hs.scrollLeft = sl;
  },
  pre: el => { const d = ui.flow.d, it = BYID[d.id], g = gOf(it, d.o), p = presetList(it, g)[Number(el.dataset.v)]; if (!p) return; applyPreset(d, it, g, p); updGlass(); },
  fav: el => {
    const d = ui.flow.d; if (d.custom && !customValid(d)) { toast('양을 먼저 넣어 주세요'); return; }
    const i = S.favs.findIndex(x => x.key === favKey(d));
    if (i >= 0) { S.favs.splice(i, 1); toast('즐겨찾기에서 뺐어요'); }
    else { S.favs.unshift(favFromD(d)); if (S.favs.length > 12) S.favs.pop(); toast('즐겨찾기에 넣었어요. 홈에서 한 번에 기록할 수 있어요'); }
    save(); el.setAttribute('aria-pressed', String(i < 0)); el.innerHTML = i < 0 ? I.starOn : I.star;
    anim(el, [{transform:'scale(1.35)'}, {transform:'none'}], {duration:300, easing:'cubic-bezier(.3,1.45,.5,1)'});
  },
  favs: () => go('favs'),
  'favs-me': () => startFlow('fav', 'list', {}, 'fwd'),
  'fav-del': el => {
    const i = S.favs.findIndex(x => x.key === el.dataset.key); if (i < 0) return;
    const [f] = S.favs.splice(i, 1); save(); swapCur();
    toast('즐겨찾기에서 뺐어요', () => { S.favs.splice(i, 0, f); save(); swapCur(); });
  },
  'photo-clear': () => { ui.flow.d.photo = null; swapCur(); },
  'ing-add': el => { const d = ui.flow.d, it = BYID[d.id]; if (mixAdd(d, it, el.dataset.v)) { const sl = el.parentNode.scrollLeft; swapCur(); const hs = cur.querySelectorAll('.ingadd .hscroll')[ING[el.dataset.v].abv ? 0 : 1]; if (hs) hs.scrollLeft = sl; } },
  'ing-del': el => { const d = ui.flow.d, it = BYID[d.id], g = gOf(it, d.o), i = Number(el.dataset.i), v = mixVols(g, d.o); d.o.ings.splice(i, 1); v.splice(i, 1); d.o.tops = mixTops(g, v); swapCur(); },
  'ing-step': el => { const d = ui.flow.d, it = BYID[d.id]; mixStep(d, it, Number(el.dataset.i), Number(el.dataset.d)); updGlass(); },
  'rec-commit': () => {
    const d = ui.flow.d, rec = itemRec(d); if (!rec) return;
    const before = status(); S.records.push(rec);
    const fi = S.favs.findIndex(x => x.key === favKey(d)); if (fi >= 0) S.favs[fi] = favFromD(d);
    save();
    const top = status().alerts.filter(a => !before.alerts.some(b => b.id === a.id)).sort(bySev)[0];
    closeFlow('down');
    toast(top ? top.text : `${rec.name} 기록했어요`, () => { S.records = S.records.filter(r => r.id !== rec.id); save(); swapCur(); toast('기록을 취소했어요'); });
  },
  'rec-skip': () => { closeFlow('down'); toast('좋은 선택이에요. 대신 물 한 잔 어때요?'); },
  // 피드백
  'fb-start': () => { const q = pending(); if (q.length) startFlow('fb', 'ask', {queue:q, i:0}, 'fwd'); },
  fbans: el => {
    const f = ui.flow; if (f.busy) return; f.busy = true;
    const p = f.d.queue[f.d.i];
    if (el.classList.contains('opt')) el.setAttribute('aria-pressed', 'true');
    setTimeout(() => { f.busy = false; if (ui.flow !== f) return; f.d.res = applyFb(p.day, p.kind, el.dataset.v); f.hist = []; f.cur = 'res'; paintFlow('fwd'); }, 220);
  },
  'fb-next': () => { const f = ui.flow; f.d.i++; f.cur = 'ask'; paintFlow('fwd'); },
  'fb-close': () => closeFlow('back'),
  // 홈
  det: el => startFlow('det', el.dataset.k, {}, 'fwd'),
  rp: el => { ui.rp = Number(el.dataset.v); swapCur(); },
  day: el => startFlow('day', 'view', {day:el.dataset.d}, 'fwd'),
  again: el => {
    const r = S.records.find(x => x.id === el.dataset.id); if (!r) return;
    const rec = Object.assign({}, oneOf(r), {id:uid(), t:Date.now()}); delete rec.demo; delete rec.photo;
    addRecord(rec); swapCur();
  },
  'again-fav': el => { const f = S.favs.find(x => x.key === el.dataset.key), rec = f && favRec(f, Date.now()); if (!rec) return; addRecord(rec); swapCur(); },
  del: el => {
    const i = S.records.findIndex(x => x.id === el.dataset.id); if (i < 0) return;
    const [r] = S.records.splice(i, 1); save(); swapCur();
    toast(`${r.name} 기록을 지웠어요`, () => { S.records.push(r); save(); swapCur(); });
  },
  undo: () => { const f = undoFn; undoFn = null; $('#toast').innerHTML = ''; if (f) f(); },
  // 내 기준
  seed: () => { seed(); ui.lastPct = {caf:0, alc:0}; if (ui.tab === 'me') swapCur(); else { ui.tab = 'home'; paintTab('fade'); } toast('2주 치 예시 기록을 넣었어요'); },
  unseed: () => { unseed(); swapCur(); toast('예시 기록을 지웠어요'); },
  edit: () => startFlow('ob', 'body', Object.assign(draft(), S.profile, {conds:[...(S.profile.conds || [])], meds:[...(S.profile.meds || [])], edit:true}), 'fwd'),
  reset: () => startFlow('reset', 'confirm', {}, 'up'),
  'reset-do': () => {
    Object.assign(S, fresh()); try { localStorage.removeItem(KEY); } catch (e) {}
    ui.tab = 'home'; ui.lastPct = {caf:0, alc:0};
    startFlow('ob', 'welcome', draft(), 'fade');
  },
};
/* 기록 화면 부분 갱신 (다시 그리지 않고 필요한 곳만) */
function updPv() {
  const f = ui.flow; if (!f || f.cur !== 'item') return;
  const x = pvData(f.d), box = cur.querySelector('#pv'); if (!box) return;
  const pv = box.firstElementChild;
  if (!x || !pv || pv.dataset.k !== x.k) box.innerHTML = pvHTML(x);
  else {
    pv.querySelector('#pva').textContent = x.amt;
    const v = pv.querySelector('#pvv'); v.textContent = x.f(x.v1); v.className = x.v1 > x.lim ? 'over' : '';
    const g0 = pv.querySelector('#pg0'), g1 = pv.querySelector('#pg1');
    g0.style.width = x.p0.toFixed(1) + '%'; g1.style.width = x.p1.toFixed(1) + '%'; g0.style.background = g1.style.background = x.color;
    pv.querySelector('#pval').innerHTML = x.news.slice(0, 2).map(alertRow).join('');
  }
  const s = cur.querySelector('#ctas'); if (s) { s.textContent = x ? x.h : emptyMsg(); s.className = 'cta-sum ' + (x ? x.tone : ''); }
  const b = cur.querySelector('#ctab'); if (b && b.dataset.s !== ctaState(x)) { b.dataset.s = ctaState(x); b.innerHTML = ctaBtns(x); }
}
function updPanel(pop) {
  const d = ui.flow.d, it = d.custom ? null : BYID[d.id], p = cur.querySelector('#panel'); if (!p) return;
  const hs = p.querySelector('.hscroll'), sl = hs ? hs.scrollLeft : 0;
  p.outerHTML = panelHTML(d, it).replace(' data-in', '');
  const hs2 = cur.querySelector('#panel .hscroll'); if (hs2) hs2.scrollLeft = sl;
  if (pop) anim(cur.querySelector(pop), [{transform:'scale(1.18)'}, {transform:'none'}], {duration:220});
}
function updGlass(focusH) {
  const f = ui.flow; if (!f || f.cur !== 'item') return;
  const d = f.d, it = BYID[d.id], gb = cur.querySelector('#gbox'); if (!gb || !it) return;
  gb.innerHTML = gArt(d, it);
  const g = gOf(it, d.o), ro = cur.querySelector('#ro'), L = it.builder ? [] : presetList(it, g); if (ro) ro.innerHTML = it.builder ? mixRo(d, it) : roText(d, it);
  const ly = cur.querySelector('#layers'); if (ly && it.builder) ly.innerHTML = mixRows(d, it);
  cur.querySelectorAll('[data-a="pre"]').forEach(b => b.setAttribute('aria-pressed', String(preOn(d, it, g, L[Number(b.dataset.v)]))));
  if (focusH) { const h = gb.querySelector(`[data-h="${focusH}"]`); if (h) try { h.focus({preventScroll:true}); } catch (e) {} }
  updPv();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  if (el.closest('.screen') && el.closest('.screen') !== cur) return;
  const fn = ACT[el.dataset.a]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  const t = e.target, f = ui.flow; if (!f) return;
  if (t.closest('.big-in')) fitInput(t);
  if (t.id === 'ob-w' || t.id === 'ob-h') {
    f.d[t.id === 'ob-w' ? 'weight' : 'height'] = t.value; const b = cur.querySelector('[data-a="ob-w-next"]'); if (b) b.disabled = !validBody(f.d);
    const er = cur.querySelector('#ob-w-err'); if (er) er.hidden = true;
  } else if (t.id === 'ob-b') {
    f.d.birth = t.value; const b = cur.querySelector('[data-a="ob-b-next"]'); if (b) b.disabled = !validB(t.value);
    const er = cur.querySelector('#ob-b-err'); if (er) er.hidden = true;
  } else if (t.id === 'q') {
    f.d.q = t.value; cur.querySelector('#plist').innerHTML = pickBody(f.d);
  } else if (t.id && t.id.startsWith('cu-')) {
    f.d[t.id.slice(3)] = t.value; updPv();
    const sb = cur.querySelector('[data-a="fav"]'); if (sb) { const on = isFav(f.d); sb.setAttribute('aria-pressed', String(on)); sb.innerHTML = on ? I.starOn : I.star; }
  } else if (t.id === 'mx-name') {
    f.d.o.name = t.value; updPv();
    const sb = cur.querySelector('[data-a="fav"]'); if (sb) { const on = isFav(f.d); sb.setAttribute('aria-pressed', String(on)); sb.innerHTML = on ? I.starOn : I.star; }
  } else if (t.id === 'rtime' && t.value) {
    f.d.ago = null; f.d.time = t.value;
    cur.querySelectorAll('[data-a="when"]').forEach(b => b.setAttribute('aria-pressed', 'false')); t.closest('.tchip').classList.add('on'); updPv();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'photo' && t.files && t.files[0] && ui.flow) {
    const f = ui.flow;
    readPhoto(t.files[0]).then(u => { if (ui.flow !== f) return; if (!u) return toast('사진을 읽지 못했어요. 다른 사진을 골라 주세요'); f.d.photo = u; swapCur(); });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.flow) { goBack(); return; }
  if (e.key === 'Enter' && e.target.id === 'ob-h') { e.preventDefault(); const w = cur.querySelector('#ob-w'); if (w) w.focus(); }
  if (e.key === 'Enter' && e.target.id === 'ob-w') { e.preventDefault(); ACT['ob-w-next'](); }
  if (e.key === 'Enter' && e.target.id === 'ob-b') { e.preventDefault(); ACT['ob-b-next'](); }
  const hd = e.target.closest && e.target.closest('.hdl');
  if (hd && ui.flow && ui.flow.cur === 'item' && /^(ArrowUp|ArrowDown|ArrowLeft|ArrowRight|PageUp|PageDown)$/.test(e.key)) {
    e.preventDefault(); const d = ui.flow.d, it = BYID[d.id], h = hd.dataset.h, st = /Page/.test(e.key) ? 0.1 : 0.02, dir = /Up|Right/.test(e.key) ? 1 : -1;
    gSet(d, it, h, (h[0] === 'b' ? d.o.tops[Number(h.slice(1))] : h === 'top' ? d.o.top : d.o.split) + dir * st); updGlass(h);
  }
});
let gdrag = null, gRaf = 0;
function gT(e, it, d) {
  const svg = cur.querySelector('#gsvg'); if (!svg) return 0;
  const r = svg.getBoundingClientRect(), G = gGeom(gOf(it, d.o));
  return clamp((G.y0 - (e.clientY - r.top) * (GV.H / r.height)) / G.bh, 0, 1);
}
document.addEventListener('pointerdown', e => {
  const gb = e.target.closest && e.target.closest('#gbox'), f = ui.flow;
  if (!gb || !f || f.cur !== 'item' || gb.closest('.screen') !== cur) return;
  const d = f.d, it = BYID[d.id]; if (!it || !it.glasses) return;
  const pill = e.target.closest('.hdl'), t = gT(e, it, d);
  let h = pill ? pill.dataset.h : 'top';
  if (!pill && it.mix) h = Math.abs(t - d.o.split) < Math.abs(t - d.o.top) ? 'split' : 'top';
  if (it.builder) { if (!d.o.tops.length) return; if (!pill) { let bi = 0; d.o.tops.forEach((x, i) => { if (Math.abs(x - t) < Math.abs(d.o.tops[bi] - t)) bi = i; }); h = 'b' + bi; } }
  gdrag = {h, id:e.pointerId};
  try { gb.setPointerCapture(e.pointerId); } catch (x) {}
  if (!pill) { gSet(d, it, h, t); updGlass(); }
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!gdrag || e.pointerId !== gdrag.id) return;
  const f = ui.flow; if (!f || f.cur !== 'item') { gdrag = null; return; }
  const d = f.d, it = BYID[d.id]; gSet(d, it, gdrag.h, gT(e, it, d));
  if (!gRaf) gRaf = requestAnimationFrame(() => { gRaf = 0; updGlass(); });
});
const gEnd = e => { if (gdrag && e.pointerId === gdrag.id) { gdrag = null; if (gRaf) { cancelAnimationFrame(gRaf); gRaf = 0; } updGlass(); } };
document.addEventListener('pointerup', gEnd); document.addEventListener('pointercancel', gEnd);
setInterval(() => { if (!ui.flow && ui.tab === 'home' && document.visibilityState === 'visible') swapCur(); }, 60000);

if (S.profile) S.profile = normProfile(S.profile);
if (!S.profile) startFlow('ob', 'welcome', draft(), 'none');
else paintTab('none');
})();
</script>
